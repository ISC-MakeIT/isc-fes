name: Production DB backup

on:
  schedule:
    # UTC。準備期間は03:17 JST。本番期間は '17 * * * *' へ変更する。
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: backup-db-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      failure_stage: ${{ steps.backup.outputs.failure_stage || steps.stage.outputs.failure_stage }}
    steps:
      - name: Initialize failure stage
        id: stage
        run: echo 'failure_stage=checkout-or-aws-authentication' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DB_BACKUP_ROLE_ARN }}
          role-session-name: github-actions-backup-${{ github.run_id }}
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Back up production DB through SSM
        id: backup
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKUP_AWS_REGION: ap-northeast-1
          BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash infra/deploy/scripts/backup-db.sh

  notify-failure:
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DB_BACKUP_DISCORD_WEBHOOK_URL }}
          BACKUP_FAILURE_STAGE: ${{ needs.backup.outputs.failure_stage || 'job-timeout-or-runner-failure' }}
          BACKUP_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun infra/deploy/scripts/notify-backup-failure.ts
