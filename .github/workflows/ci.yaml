name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then echo "$fmt_out"; exit 1; fi
      - name: Vet
        run: go vet ./...

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test
        run: go test -race -shuffle=on ./...

  generated-code-is-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI code
        run: make gen-api
      - name: Generate sqlc code
        run: make sqlc
      - name: Check generated code is up to date
        run: |
          generated_changes="$(git status --porcelain -- \
            backend/internal/api/gen.go \
            backend/internal/db/sqlc \
            frontend/src/shared/api/schema.d.ts)"

          if [ -n "$generated_changes" ]; then
            echo "生成コードが最新ではありません。make gen-api と make sqlc を実行してください。"
            echo "$generated_changes"
            git diff -- \
              backend/internal/api/gen.go \
              backend/internal/db/sqlc \
              frontend/src/shared/api/schema.d.ts

            while IFS= read -r -d '' file; do
              git diff --no-index -- /dev/null "$file" || true
            done < <(git ls-files --others --exclude-standard -z -- \
              backend/internal/api/gen.go \
              backend/internal/db/sqlc \
              frontend/src/shared/api/schema.d.ts)

            exit 1
          fi

  web-code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run fmt:check
      - name: Lint
        run: pnpm run lint

  push-backend-image:
    needs:
      - go-code-quality
      - go-test
      - generated-code-is-up-to-date
      - web-code-quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: push-backend-image-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: isc-fes/backend
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Check whether image already exists
        id: image
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>"$error_file"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "既にECRに存在するためpushを省略します: $IMAGE_TAG"
          elif grep -q "ImageNotFoundException" "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "ECRのImage確認に失敗しました。" >&2
            cat "$error_file" >&2
            exit 1
          fi
      - name: Set up QEMU
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Backend image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
