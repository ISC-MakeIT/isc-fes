name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then echo "$fmt_out"; exit 1; fi
      - name: Vet
        run: go vet ./...

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Test
        run: go test -race -shuffle=on ./...

  generated-code-is-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: make generate
      - name: Check generated code is up to date
        run: |
          generated_changes="$(git status --porcelain -- \
            backend/routers/gen.go \
            backend/db/sqlc \
            frontend/src/shared/api/schema.d.ts)"

          if [ -n "$generated_changes" ]; then
            echo "生成コードが最新ではありません。make generate を実行してください。"
            echo "$generated_changes"
            git diff -- \
              backend/routers/gen.go \
              backend/db/sqlc \
              frontend/src/shared/api/schema.d.ts

            while IFS= read -r -d '' file; do
              git diff --no-index -- /dev/null "$file" || true
            done < <(git ls-files --others --exclude-standard -z -- \
              backend/routers/gen.go \
              backend/db/sqlc \
              frontend/src/shared/api/schema.d.ts)

            exit 1
          fi

  web-code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run fmt:check
      - name: Lint
        run: pnpm run lint
      - name: Unit Test
        run: pnpm run test

  push-backend-image:
    needs:
      - go-code-quality
      - go-test
      - generated-code-is-up-to-date
      - web-code-quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: push-backend-image-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: isc-fes/backend
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Check whether image already exists
        id: image
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>"$error_file"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "既にECRに存在するためpushを省略します: $IMAGE_TAG"
          elif grep -q "ImageNotFoundException" "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "ECRのImage確認に失敗しました。" >&2
            cat "$error_file" >&2
            exit 1
          fi
      - name: Set up QEMU
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Backend image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          provenance: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  deploy-backend:
    needs: push-backend-image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: isc-fes/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check whether this is the latest main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"

          if [[ ! "$latest_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "mainの最新Commit SHAを取得できませんでした: ${latest_main_sha}" >&2
            exit 1
          fi

          if [[ "$latest_main_sha" != "$GITHUB_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "古いmainのWorkflowなのでdeployを省略します: ${GITHUB_SHA}"
            echo "現在のmain: ${latest_main_sha}"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials for deployment
        if: steps.freshness.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Resolve deployment target
        if: steps.freshness.outputs.deploy == 'true'
        id: target
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_IDが不正です。" >&2
            exit 1
          fi

          mapfile -t instance_ids < <(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                Name=tag:Name,Values=isc-fes-api-server \
                Name=instance-state-name,Values=running \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text |
              tr '\t' '\n' |
              sed '/^$/d'
          )

          if (( ${#instance_ids[@]} != 1 )); then
            echo "稼働中のAPI Serverを一意に特定できませんでした。件数: ${#instance_ids[@]}" >&2
            exit 1
          fi
          if [[ ! "${instance_ids[0]}" =~ ^i-[0-9a-f]+$ ]]; then
            echo "EC2 Instance IDが不正です: ${instance_ids[0]}" >&2
            exit 1
          fi

          repository_url="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "instance_id=${instance_ids[0]}" >> "$GITHUB_OUTPUT"
          echo "repository_url=${repository_url}" >> "$GITHUB_OUTPUT"
      - name: Deploy Backend to EC2
        if: steps.freshness.outputs.deploy == 'true'
        env:
          DEPLOY_AWS_REGION: ${{ env.AWS_REGION }}
          DEPLOY_BACKEND_REPOSITORY_URL: ${{ steps.target.outputs.repository_url }}
          DEPLOY_API_SERVER_INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-backend.sh
