services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: isc-fes
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: isc-fes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isc-fes"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer:5.5.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
