services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: isc-fes
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: isc-fes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isc-fes"]
      interval: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: isc-fes-local
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./backend/localstack/init:/etc/localstack/init/ready.d:ro

  adminer:
    image: adminer:5.5.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

  swagger-editor:
    image: docker.swagger.io/swaggerapi/swagger-editor:v4-latest
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SWAGGER_FILE: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro

volumes:
  pgdata:
  localstack-data:
