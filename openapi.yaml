openapi: 3.0.3
info:
  title: isc-fes API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: https://api.fes.iwasaki.ac.jp
    description: 本番環境
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /me:
    get:
      operationId: getMe
      summary: ログイン中のアカウントを取得する
      security:
        - AccountSession: []
      responses:
        "200":
          description: ログイン中のアカウント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: 未ログインまたはセッションが無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: getOrders
      summary: 自分の注文一覧を取得する
      description: |
        Guestセッションに紐づく自分の注文を全店舗横断で、新しい注文から取得する。
        statusesを省略した場合はすべての状態を対象にする。
        Guestセッションが未発行の場合は空の一覧を返し、GETではGuestを新規発行しない。
        注文後の店舗の閉店・販売状況にかかわらず取得できる。
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderStatuses"
      responses:
        "200":
          description: 自分の注文一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrdersResponse"
        "400":
          description: クエリパラメータが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      summary: カートから注文を確定する
      description: |
        同じGuest・店舗・元カートversionの再送は、現在の販売状況や権限にかかわらず同じ注文を返す。
        通常のpending/ready注文は全店舗合計で2件まで。当該店舗のStaff/Managerによる注文は件数制限を免除し、集計から除外する。
        成功時は同じカートの明細を消去してversionを1増やす。明細順序は保証しない。
      security:
        - GuestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: 注文を作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: 成立済み注文への再送
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: 空カート・数量・メニュー種類数などの入力が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または承認されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: カートversion競合・閉店・利用不可の選択・同時注文件数制限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{order_id}:
    get:
      operationId: getOrderByID
      summary: 自分の注文詳細を取得する
      description: |
        Guestセッションに紐づく自分の注文を取得する。
        Guestセッションが未発行の場合、注文が存在しない場合、自分の注文でない場合は404を返す。
        GETではGuestを新規発行しない。注文後の店舗の閉店・販売状況にかかわらず取得できる。
        現時点ではダミー実装として404を返す。
      security: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: 自分の注文詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: 注文IDの形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 注文が存在しない、または自分の注文ではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{store_id}/orders:
    get:
      operationId: getOrdersByStoreID
      summary: 店舗の注文一覧を取得する
      description: |
        当該店舗のStaff/Managerが、注文時の明細を含む店舗の注文一覧を古い注文から取得する。
        statusesを省略した場合はpending/readyを対象にする。
        キッチンはstatuses=pending、受け渡しはstatuses=pending&statuses=readyで取得する。
        店舗の閉店・現在の販売状況にかかわらず取得できる。
        現時点ではダミー実装としてAccountセッションのみを検証し、空の一覧を返す。
        店舗の存在・Membershipの検証と注文取得は未実装。
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/OrderStatuses"
      responses:
        "200":
          description: 店舗の注文一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrdersResponse"
        "400":
          description: 店舗IDまたはクエリパラメータが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログインまたはセッションが無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 当該店舗のStaff/Managerではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviews:
    post:
      operationId: createReview
      summary: アプリの利用体験に対するレビューを投稿する
      description: |
        ゲスト・店舗側のどちらからでも投稿できるアプリへのレビュー。
        ログインは不要。既存のゲスト・アカウントセッションがある場合だけ投稿者IDを保存する。
        投稿のためにゲストセッションを新規発行しない。
        投稿元の操作はtriggerで記録する。レビュー表示の抽選と1日間隔の制御はフロントエンドが行う。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewInput"
      responses:
        "201":
          description: レビューを投稿した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms:
    get:
      operationId: getRooms
      summary: 利用可能な教室一覧を取得する
      responses:
        "200":
          description: 教室一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRoomsResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images:
    post:
      operationId: uploadImage
      summary: 画像をアップロードする
      security:
        - AccountSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: |
                    画像。JPEG、PNG、WebPに対応する。
                    最大ファイルサイズは10MB。
      responses:
        "201":
          description: 画像をアップロードした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImageResponse"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: アップロードされた画像が大きすぎる
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: 対応していない画像形式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 画像の内容が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 画像ストレージが一時的に利用できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /store-applications:
    get:
      operationId: getStoreApplications
      summary: 店舗申請一覧を取得する
      security:
        - AccountSession: []
      responses:
        "200":
          description: 店舗申請一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStoreApplicationsResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 管理者権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStoreApplication
      summary: 店舗の作成申請を作成する
      security:
        - AccountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreApplicationInput"
      responses:
        "201":
          description: 店舗申請を作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStoreApplicationResponse"

        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /store-applications/review-status/{store_id}:
    put:
      operationId: updateStoreApplicationReviewStatus
      summary: 店舗申請の審査ステータスを更新する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reviewStatus
              properties:
                reviewStatus:
                  $ref: "#/components/schemas/StoreReviewStatus"
      responses:
        "200":
          description: 店舗申請の審査ステータスを更新した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStoreApplicationReviewStatusResponse"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 管理者権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗申請が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 更新できない審査ステータスへの変更 approved -> approved など
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores:
    get:
      operationId: getVisibleStores
      summary: 閲覧可能な店舗一覧を取得する
      parameters:
        - name: member_only
          in: query
          required: false
          description: true の場合、ログイン中のアカウントが所属する承認済み・申請中の店舗を取得する
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 店舗一覧。member_only が false の場合は承認済みの店舗と自分が管理者である申請中の店舗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVisibleStoresResponse"
        "400":
          description: クエリパラメータが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: member_only が true で未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{store_id}:
    get:
      operationId: getApprovedStoreByID
      summary: 承認済みの店舗を取得する
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 店舗情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または承認済みではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStore
      summary: 店舗情報を部分更新する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreInput"
      responses:
        "200":
          description: 更新後の店舗情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 店舗の管理権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または承認済みではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{store_id}/members:
    get:
      operationId: getStoreMembers
      summary: 店舗のメンバー一覧を取得する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 店舗のメンバー一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStoreMembersResponse"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または店舗のメンバーではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{store_id}/members/{account_id}:
    get:
      operationId: getStoreMemberByStoreIDAndAccountID
      summary: 店舗のメンバーを取得する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 店舗のメンバー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreMember"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または対象が店舗のメンバーではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeStoreMember
      summary: 店舗のメンバーを削除する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 店舗のメンバーを削除した
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限不足（自分が店舗管理者ではない、対象が店舗管理者である）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または対象が店舗のメンバーではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{store_id}/menus:
    get:
      operationId: getMenusByStoreID
      summary: 店舗のメニュー一覧を取得する
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 店舗のメニュー一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMenusByStoreIDResponse"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 店舗が存在しない、または承認済みではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMenu
      summary: 店舗のメニューを作成する
      security:
        - AccountSession: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuInput"
      responses:
        "201":
          description: 店舗のメニューを作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: リクエスト形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
