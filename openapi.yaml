          format: uuid
        cartItemId:
          type: string
          format: uuid
        toppingId:
          type: string
          format: uuid
        name:
          type: string
        unitPrice:
          type: integer
          format: int32
        available:
          type: boolean
          description: トッピングが現在利用可能かどうか。削除・売り切れ・対象メニューとの関連解除の場合はfalseになる。選択自体はカートに残る。
