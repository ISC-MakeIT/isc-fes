      type: integer
      format: int32
      description: 店舗の混雑度。1、2、3の3段階で、3が最も混んでいる。新規店舗と既存店舗の初期値は1。
      enum: [1, 2, 3]
      x-enum-varnames:
        [StoreCongestionLevelLow, StoreCongestionLevelMedium, StoreCongestionLevelHigh]
