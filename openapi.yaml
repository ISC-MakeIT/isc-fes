components:
  parameters:
    OrderStatuses:
      name: statuses
      in: query
      required: false
      description: |
        取得対象の注文状態。複数指定はOR条件。
        statuses=pending&statuses=readyのように同じキーを繰り返して指定する。
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/components/schemas/OrderStatus"
      example: [pending, ready]
  securitySchemes:
    AccountSession:
      type: apiKey
      in: cookie
      name: isc_fes_account_session
    GuestSession:
      type: apiKey
      in: cookie
      name: isc_fes_guest_session
  schemas:
    CreateReviewInput:
      type: object
      additionalProperties: false
      required:
        - rating
      properties:
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: アプリへの満足度（1〜5の星）
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: 任意の感想・要望。空白のみの場合は未入力として保存する。
          pattern: '^[^\x00]*$'
        trigger:
          type: string
          nullable: true
          maxLength: 100
          description: |
            フロントエンドで何をトリガーにレビューモーダルを表示したかを識別するための文字列。
            これにより、レビューがどのような操作をしていたユーザーによるものかが保存できる。
          example: order_complete
          pattern: '^[^\x00]*$'
    CreateReviewResponse:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [status, commitHash, deployedAt]
      properties:
        status:
          type: string
          example: ok
        commitHash:
          type: string
          description: 稼働中のイメージの元となったGit Commit SHA
          example: 0123456789abcdef0123456789abcdef01234567
        deployedAt:
          type: string
          format: date-time
          description: デプロイされた日時（正確にはビルドされた日時だが、最大でも数分程度の誤差のはず）
          example: "2026-08-29T12:34:56Z"
    MeResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - pictureUrl
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        pictureUrl:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - member
            - admin
    GetRoomsResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          description: ルームの総数
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    Room:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    StoreReviewStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    ImageObjectKey:
      type: string
      pattern: ^images/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: images/e625d731-8d26-4de9-ac77-a1bc96affb8e
    UploadImageResponse:
      type: object
      required:
        - imageObjectKey
      properties:
        imageObjectKey:
          $ref: "#/components/schemas/ImageObjectKey"
    CreateStoreApplicationInput:
      type: object
      required:
        - name
        - room
        - description
        - allergenIds
        - imageObjectKey
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: たこ焼き屋
        room:
          type: string
          minLength: 1
          maxLength: 50
          example: 605教室
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: 外はカリカリ、中はトロトロのたこ焼きです。
        allergenIds:
          type: array
          description: 店舗で使用するアレルゲンのID一覧。該当するアレルゲンがない場合は空配列。
          items:
            type: string
            format: uuid
          uniqueItems: true
        imageObjectKey:
          $ref: "#/components/schemas/ImageObjectKey"
    CreateStoreApplicationResponse:
      type: object
      required:
        - id
        - reviewStatus
        - submittedAt
      properties:
        id:
          type: string
          format: uuid
          description: |
            店舗申請のID。内部的にはstores.idと同一。

        reviewStatus:
          $ref: "#/components/schemas/StoreReviewStatus"

        submittedAt:
          type: string
          format: date-time
    GetAllergensResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          description: アレルゲンの総数
        data:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
    Allergen:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    GetStoreMembersResponse:
      type: object
      required:
        - data
        - total
      properties:
        total:
          type: integer
          description: 店舗メンバーの総数
        data:
          type: array
          items:
            $ref: "#/components/schemas/StoreMember"
    UpdateStoreApplicationReviewStatusResponse:
      type: object
      required:
        - id
        - reviewStatus
      properties:
        id:
          type: string
          format: uuid
          description: |
            店舗申請のID。内部的にはstores.idと同一。

        reviewStatus:
          $ref: "#/components/schemas/StoreReviewStatus"
    GetMenusByStoreIDResponse:
      type: object
      required:
        - data
        - total
      properties:
        total:
          type: integer
          description: 店舗メニューの総数
