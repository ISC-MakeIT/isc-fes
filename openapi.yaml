          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StoreMemberRole"
    GetOrdersResponse:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          minimum: 0
          description: 指定した条件に一致する注文の総数
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    CreateOrderInput:
      type: object
      additionalProperties: false
      required: [storeId, expectedCartVersion]
      properties:
        storeId:
          type: string
          format: uuid
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        expectedCartVersion:
          type: integer
          format: int32
          minimum: 1
          description: 注文に使うカートのversion。成立済み注文の再送にも同じ値を使用する。
    OrderStatus:
      type: string
      enum: [pending, ready, completed, cancelled]
    Order:
      type: object
      required:
        [
          id,
          storeId,
          status,
          totalAmount,
          displayNumber,
          version,
          storeName,
          roomName,
          items,
          readyAt,
          completedAt,
          cancelledAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: integer
          format: int64
          description: トッピングを含む合計金額（円）
        displayNumber:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
        storeName:
          type: string
          description: 注文時の店舗名
        roomName:
          type: string
          description: 注文時の教室名
        items:
          type: array
          description: 注文時の明細。カート内の順序は保証しない。
          items:
            $ref: "#/components/schemas/OrderItem"
        readyAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      required: [id, menuId, menuName, unitPrice, quantity, toppings]
      properties:
        id:
          type: string
          format: uuid
        menuId:
          type: string
          format: uuid
        menuName:
          type: string
        unitPrice:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemTopping"
    OrderItemTopping:
      type: object
