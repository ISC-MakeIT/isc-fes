            店舗メンバー招待のID。内部的にはstore_invitations.idと同一。
        storeId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StoreMemberRole"
        maxUses:
          type: integer
          format: int32
          nullable: true
          description: 招待リンクの最大使用回数。nullの場合は無制限。
        createdAt:
          type: string
          format: date-time
    GetVisibleStoresResponse:
      type: object
