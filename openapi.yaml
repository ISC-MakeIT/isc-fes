      properties:
        total:
          type: integer
          description: メニューで選択可能なトッピングの総数
        data:
          type: array
          items:
            $ref: "#/components/schemas/Topping"
    StoreMemberRole:
      type: string
      enum:
        - staff
        - manager
    CreateStoreInvitationResponse:
      type: object
