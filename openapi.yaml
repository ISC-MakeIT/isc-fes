          type: string
          format: uuid
        toppingName:
          type: string
        unitPrice:
          type: integer
          format: int32
    UpdateCartInput:
      type: object
      required:
        - expectedVersion
        - items
      properties:
        expectedVersion:
          type: integer
          format: int32
          description: |
            カートの更新前のバージョン。カートの更新時に、この値と現在のカートのバージョンが一致しない場合は409 Conflict
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateCartItemInput"
    UpdateCartItemInput:
      type: object
      required:
        - menuId
        - quantity
        - toppingIds
      properties:
        id:
          type: string
          description: カートアイテムのID。新規追加の場合は省略する。既存のカートアイテムを更新する場合は指定する。
          format: uuid
        menuId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        toppingIds:
          type: array
          items:
            type: string
            format: uuid
    Cart:
      type: object
      required:
        - storeId
        - version
        - items
        - totalAmount
        - canCheckout
      properties:
        storeId:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        totalAmount:
          type: integer
        canCheckout:
          type: boolean
          description: カートの内容で注文可能かどうか。店舗が閉店している場合、カートに利用できないアイテムが含まれている場合、カートがからの場合はfalseになる。
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
    CartItem:
      required:
        - id
        - menuId
        - name
        - imageUrl
        - quantity
        - unitPrice
        - available
        - toppings
      properties:
        id:
          type: string
          format: uuid
        menuId:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
        available:
          type: boolean
          description: メニューが現在利用可能かどうか。店舗がメニューを削除した場合や売り切れはfalseになる。
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: integer
          format: int32
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/CartItemTopping"
    CartItemTopping:
      type: object
      required:
